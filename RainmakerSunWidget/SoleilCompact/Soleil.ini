; Adaptation de Planète compacte, elle-même adaptée de Jord par crosseout (CC BY-NC-SA 3.0).
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Actualiser les données
ContextAction=[!CommandMeasure Actualisation "Run"]
ContextTitle2=Taille : petite
ContextAction2=[!WriteKeyValue Variables Echelle "0.8"][!Refresh]
ContextTitle3=Taille : moyenne
ContextAction3=[!WriteKeyValue Variables Echelle "1.0"][!Refresh]
ContextTitle4=Taille : grande
ContextAction4=[!WriteKeyValue Variables Echelle "1.3"][!Refresh]

[Metadata]
Name=Notre Soleil
Author=Pour Melisa
Information=Image SDO et observations NOAA. Les données peuvent être différées.
Version=1.0
License=CC BY-NC-SA 3.0

[Variables]
Echelle=1.0
@include=#@#donnees.inc

[Actualisation]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#actualiser.ps1"
State=Hide
Timeout=120000
FinishAction=[!Refresh "RainmakerSunWidget\SoleilCompact"][!Refresh "RainmakerSunWidget\VeilleSolaire"]

[Minuterie]
Measure=Loop
StartValue=0
EndValue=300
Increment=1
LoopCount=0
IfCondition=(Minuterie = 300)
IfTrueAction=[!CommandMeasure Actualisation "Run"]
IfCondition2=((Minuterie = 1) && (#PremierDemarrage# = 1))
IfTrueAction2=[!CommandMeasure Actualisation "Run"]

[Fond]
Meter=Shape
Shape=Rectangle 0,0,(326*#Echelle#),(194*#Echelle#),(16*#Echelle#) | Fill Color 0,0,0,255 | StrokeWidth (#Echelle#) | Stroke Color 70,151,166,150
Shape2=Rectangle (172*#Echelle#),(15*#Echelle#),(1*#Echelle#),(163*#Echelle#) | Fill Color 70,151,166,80 | StrokeWidth 0

[Disque]
Meter=Shape
Shape=Ellipse (84*#Echelle#),(94*#Echelle#),(62*#Echelle#) | Fill Color 40,24,12,255 | StrokeWidth (#Echelle#) | Stroke Color 110,71,36,120

[Soleil]
Meter=Image
ImageName=#@#Images\soleil.jpg
X=(2*#Echelle#)
Y=(12*#Echelle#)
W=(165*#Echelle#)
H=(165*#Echelle#)
AntiAlias=1
ToolTipText=Image ultraviolette colorisée du Soleil par la NASA / SDO, à 30,4 nm. Téléchargement : #ImageHeure#. Une image scientifique, pas une vue en couleurs naturelles.
LeftMouseUpAction=["https://sdo.gsfc.nasa.gov/data/"]

[Titre]
Meter=String
X=(14*#Echelle#)
Y=(8*#Echelle#)
FontFace=Segoe UI
FontSize=(7*#Echelle#)
FontWeight=600
FontColor=161,224,225,255
AntiAlias=1
Text=NOTRE SOLEIL

[Legende]
Meter=String
X=(84*#Echelle#)
Y=(176*#Echelle#)
StringAlign=Center
FontFace=Segoe UI
FontSize=(7*#Echelle#)
FontColor=162,200,205,255
AntiAlias=1
Text=SDO · téléch. #ImageHeure# UTC
ToolTipText=Image ultraviolette colorisée. Téléchargement : #ImageHeure# UTC ; la date de prise de vue peut être antérieure. État : #ImageEtat#.
DynamicVariables=1

[SousTitre]
Meter=String
X=(181*#Echelle#)
Y=(10*#Echelle#)
FontFace=Segoe UI
FontSize=(8*#Echelle#)
FontWeight=600
FontColor=221,250,247,255
AntiAlias=1
Text=POULS DU SOLEIL

[Bouton]
Meter=String
X=(314*#Echelle#)
Y=(9*#Echelle#)
StringAlign=Right
FontFace=Segoe UI Symbol
FontSize=(11*#Echelle#)
FontColor=111,228,218,255
AntiAlias=1
Text=↻
ToolTipText=Actualiser les données maintenant
LeftMouseUpAction=[!CommandMeasure Actualisation "Run"]

[RayonsTitre]
Meter=String
X=(181*#Echelle#)
Y=(32*#Echelle#)
FontFace=Segoe UI
FontSize=(8*#Echelle#)
FontColor=204,225,225,255
AntiAlias=1
Text=Rayons X  #Rayons#
ToolTipText=Classe du flux de rayons X mesuré par GOES, NOAA. Mesure : #RayonsHeure# UTC. #RayonsEtat#
DynamicVariables=1

[Ligne]
Meter=Shape
Shape=Rectangle (181*#Echelle#),(49*#Echelle#),(132*#Echelle#),(4*#Echelle#),(2*#Echelle#) | Fill Color 51,75,83,255 | StrokeWidth 0
Shape2=Rectangle (181*#Echelle#),(49*#Echelle#),(53*#Echelle#),(4*#Echelle#),(2*#Echelle#) | Fill Color 78,220,198,255 | StrokeWidth 0
; Cette ligne est décorative et ne représente pas une valeur.

[Vent]
Meter=String
X=(181*#Echelle#)
Y=(58*#Echelle#)
FontFace=Segoe UI
FontSize=(8*#Echelle#)
FontColor=223,238,237,255
AntiAlias=1
Text=Vent solaire  #Vent# km/s
ToolTipText=Vitesse du vent solaire près de la Terre, NOAA. Mesure : #VentHeure# UTC. #VentEtat#
DynamicVariables=1

[Flux]
Meter=String
X=(181*#Echelle#)
Y=(74*#Echelle#)
FontFace=Segoe UI
FontSize=(8*#Echelle#)
FontColor=223,238,237,255
AntiAlias=1
Text=Flux F10,7  #Flux# sfu
ToolTipText=Flux radio solaire à 10,7 cm, NOAA. Mesure : #FluxHeure# UTC. #FluxEtat#
DynamicVariables=1

[EruptionTitre]
Meter=String
X=(181*#Echelle#)
Y=(96*#Echelle#)
FontFace=Segoe UI
FontSize=(8*#Echelle#)
FontWeight=600
FontColor=132,225,208,255
AntiAlias=1
Text=ÉRUPTION · NOAA

[Eruption]
Meter=String
X=(181*#Echelle#)
Y=(112*#Echelle#)
FontFace=Segoe UI
FontSize=(8*#Echelle#)
FontColor=223,238,237,255
AntiAlias=1
Text=Dernier pic : #Eruption#
ToolTipText=Classe maximale du dernier événement rapporté par GOES, pas la classe courante. Pic : #EruptionHeure# UTC.
DynamicVariables=1

[EruptionDate]
Meter=String
X=(181*#Echelle#)
Y=(128*#Echelle#)
W=(136*#Echelle#)
H=(13*#Echelle#)
ClipString=1
FontFace=Segoe UI
FontSize=(7*#Echelle#)
FontColor=174,204,204,255
AntiAlias=1
Text=Pic : #EruptionHeure# UTC
DynamicVariables=1

[Sources]
Meter=String
X=(181*#Echelle#)
Y=(148*#Echelle#)
FontFace=Segoe UI
FontSize=(7*#Echelle#)
FontColor=154,190,193,255
AntiAlias=1
Text=NOAA · météo spatiale ↗
ToolTipText=Ouvrir les observations et prévisions de la NOAA.
LeftMouseUpAction=["https://www.swpc.noaa.gov/"]

[Etat]
Meter=String
X=(181*#Echelle#)
Y=(172*#Echelle#)
W=(136*#Echelle#)
H=(12*#Echelle#)
ClipString=1
FontFace=Segoe UI
FontSize=(7*#Echelle#)
FontColor=135,187,188,255
AntiAlias=1
Text=#Etat# · #MAJ#
DynamicVariables=1
ToolTipText=État des sources : #Etat#. Dernière tentative : #MAJ# heure locale. Survoler chaque mesure pour son horodatage UTC.
