; Adaptation solaire du panneau Veille cosmique de Melisa.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Actualiser les données
ContextAction=[!CommandMeasure Actualisation "Run"]
ContextTitle2=Taille : petite
ContextAction2=[!WriteKeyValue Variables Echelle "0.736"][!Refresh]
ContextTitle3=Taille : moyenne
ContextAction3=[!WriteKeyValue Variables Echelle "0.92"][!Refresh]
ContextTitle4=Taille : grande
ContextAction4=[!WriteKeyValue Variables Echelle "1.2"][!Refresh]

[Metadata]
Name=Veille solaire
Author=Pour Melisa
Information=Observations solaires publiques NASA et NOAA, parfois différées.
Version=1.0
License=CC BY-NC-SA 3.0

[Variables]
Echelle=0.736
@include=#@#donnees.inc

[Actualisation]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#actualiser.ps1"
State=Hide
Timeout=120000
FinishAction=[!Refresh "RainmakerSunWidget\SoleilCompact"][!Refresh "RainmakerSunWidget\VeilleSolaire"]

[Minuterie]
Measure=Loop
StartValue=0
EndValue=300
Increment=1
LoopCount=0
IfCondition=(Minuterie = 300)
IfTrueAction=[!CommandMeasure Actualisation "Run"]
IfCondition2=((Minuterie = 1) && (#PremierDemarrage# = 1))
IfTrueAction2=[!CommandMeasure Actualisation "Run"]

[Fond]
Meter=Shape
Shape=Rectangle 0,0,(450*#Echelle#),(248*#Echelle#),(16*#Echelle#) | Fill Color 0,0,0,255 | StrokeWidth (#Echelle#) | Stroke Color 68,148,164,180
Shape2=Rectangle (15*#Echelle#),(40*#Echelle#),(420*#Echelle#),(1*#Echelle#) | Fill Color 70,151,166,100 | StrokeWidth 0
Shape3=Rectangle (225*#Echelle#),(50*#Echelle#),(1*#Echelle#),(154*#Echelle#) | Fill Color 70,151,166,75 | StrokeWidth 0
Shape4=Rectangle (15*#Echelle#),(204*#Echelle#),(420*#Echelle#),(1*#Echelle#) | Fill Color 70,151,166,100 | StrokeWidth 0

[Titre]
Meter=String
X=(17*#Echelle#)
Y=(8*#Echelle#)
FontFace=Segoe UI
FontSize=(13*#Echelle#)
FontWeight=600
FontColor=224,249,247,255
AntiAlias=1
Text=VEILLE SOLAIRE

[SousTitre]
Meter=String
X=(18*#Echelle#)
Y=(27*#Echelle#)
FontFace=Segoe UI
FontSize=(7*#Echelle#)
FontColor=124,192,198,255
AntiAlias=1
Text=OBSERVATIONS • ACTIVITÉ • MÉTÉO SPATIALE

